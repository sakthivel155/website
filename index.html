<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Valentine's Day</title>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    @keyframes floatHeart {
      0% {
        transform: translateY(100vh) scale(0.2);
        opacity: 0;
      }
      90% {
        opacity: .7;
      }
      100% {
        transform: translateY(-100vh) scale(1);
        opacity: 0;
      }
    }

    body {
      background-color: #661f13;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow-y: hidden;
      scroll-behavior: none;
      position: relative;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      color: #661f13;
      z-index: 1;
      animation: floatHeart 6s linear infinite;
    }

    a {
      color: #661f13;
      text-decoration: none;
      padding: 10px 20px;
      background-color: #e9dbc9;
      border-radius: 20px;
      margin-top: 100px;
      z-index: 10;
    }

    .title {
      color: #e9dbc9;

      font-size: 2rem;
      font-family: 'Dancing Script', cursive;
      z-index: 10;
    }

    .greeting {
      color: #e9dbc9;
      font-weight: 500;
      font-size: 1.5rem;
      font-family: 'Dancing Script', cursive;
      z-index: 10;
      margin: 0;
    }
    .container{
      width: 100%;
      height: 31vh;
      background-image: url('./sources/images/4.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .content{
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: 40px;
    }
    
    .bg-img{
      
      width: 100%;
      
      object-fit: cover;
      z-index: -1;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
</head>
<body data-aos="zoom-out" data-aos-duration="2000">
  <div class="container">

   <div class="content">
    <h1 class="title">Valentine's Day</h1>
    <h2 class="greeting">Greetings</h2>
   </div> 
  </div>
  <a href="/home.html">Touch the button</a>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();

    // Create floating hearts
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerHTML = '🤍';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 10+10 ) + 's';
      heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
      document.body.appendChild(heart);

      // Remove heart after animation completes
      heart.addEventListener('animationend', () => {
        heart.remove();
      });
    }

    // Create new hearts periodically
    setInterval(createHeart, 300);
  </script>
</body>
</html>
